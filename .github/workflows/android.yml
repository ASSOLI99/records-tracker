name: Android APK

# Builds an installable APK.
# - A tag like v1.2.0 builds it and publishes a GitHub Release with the APK attached.
# - Pull requests, and pushes that touch native config, build it as a downloadable artifact.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - app.json
      - package.json
      - package-lock.json
      - plugins/**
      - src/widgets/**
      - .github/workflows/android.yml
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Optional release signing. Without these secrets the APK is signed with the debug key,
      # which is fine for sideloading but not for Google Play.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci --legacy-peer-deps

      - run: npm test

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Read the app version
        id: version
        run: echo "name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Signing arguments
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "args<<EOF"
              echo "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks"
              echo "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              echo "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              echo "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Signing with the release key."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "No release key configured; signing with the debug key."
          fi

      - name: Build the APK
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          -Pexpo.useLegacyPackaging=true
          ${{ steps.signing.outputs.args }}

      - name: Name the APK
        id: apk
        run: |
          out="records-tracker-${{ steps.version.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          body: |
            ## Install on Android · التثبيت على أندرويد

            1. Download **${{ steps.apk.outputs.file }}** below. · نزّل الملف **${{ steps.apk.outputs.file }}** من الأسفل.
            2. Open it on your phone and allow installing from this source if asked. · افتحه على هاتفك واسمح بالتثبيت من هذا المصدر إن طُلب منك.
            3. To update later, install the new APK over the old one; your data stays in your `record-tracker` folder. · للتحديث لاحقًا ثبّت الملف الجديد فوق القديم، وتبقى بياناتك في مجلد `record-tracker`.

            Works on Android 7.0+ (arm64 and armv7 phones). · يعمل على أندرويد 7.0 وأحدث.
